services:
  # VR Connect Backend Web Service on Render
  - type: web
    name: vr-connect-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vr-connect-db
          property: connectionString
      - key: CLIENT_URL
        value: https://vr-connect.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

# Render Managed PostgreSQL Database
databases:
  - name: vr-connect-db
    databaseName: vr_connect
    user: vr_user
    plan: free
    region: oregon
